# RunPod budget preset (<$50)
# Hybrid: bash scripts/train_hybrid_fold0.sh
# EfficientNet: MODEL=efficientnet_b4.ra2_in1k IMG_SIZE=384 bash scripts/train_fold0.sh

data:
  fold_csv: "/workspace/data/folds/fold0.csv"
  img_size: 224
  batch_size: 24
  num_workers: 8
  remove_borders: true

model:
  name: "hybrid_coatmini"
  num_classes: 5
  pretrained: false

training:
  epochs: 40
  lr: 0.0001
  weight_decay: 0.0001
  lr_scheduler: "cosine"
  warmup_epochs: 0
  loss:
    type: "ordinal"

callbacks:
  monitor: "val_qwk"
  patience: 10

# AMP for faster training
precision: "16-mixed"
seed: 42

# Sanity check: SANITY=1 bash scripts/train_hybrid_fold0.sh (15 ep @224)
