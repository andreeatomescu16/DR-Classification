# RunPod budget preset (<$50)
# Use with: FOLDS_DIR=/workspace/data/folds bash scripts/train_fold0.sh
# Override: MODEL=efficientnet_b4.ra2_in1k IMG_SIZE=384 BATCH_SIZE=16

data:
  fold_csv: "/workspace/data/folds/fold0.csv"
  img_size: 384
  batch_size: 16
  num_workers: 8
  remove_borders: true

model:
  name: "efficientnet_b4.ra2_in1k"
  num_classes: 5
  pretrained: true

training:
  epochs: 40
  lr: 0.0001
  weight_decay: 0.0001
  lr_scheduler: "cosine"
  warmup_epochs: 0
  loss:
    type: "weighted_ce"
    use_class_weights: true

callbacks:
  monitor: "val_qwk"
  patience: 10

# AMP for faster training
precision: "16-mixed"
seed: 42
